[workspace]
resolver = "2"
exclude = ["target"]
members = [
    "crates/cli",
    "crates/compiler",
    "crates/layout",
    "crates/core/dom",
    "crates/core/style",
    "crates/render/paint",
    "crates/render/render_wgpu",
    "crates/platform/net",
    "crates/platform/storage",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
dom = { path = "crates/core/dom" }
style = { path = "crates/core/style" }
layout = { path = "crates/layout" }
paint = { path = "crates/render/paint" }
render_wgpu = { path = "crates/render/render_wgpu" }
compiler = { path = "crates/compiler" }
cli = { path = "crates/cli" }

wgpu = "23"
winit = "0.30"
taffy = "0.5"
cssparser = "0.34"
selectors = "0.26"
rustybuzz = "0.18"
fontdb = "0.22"
unicode-linebreak = "0.1"
tungstenite = "0.24"
serde_json = "1"
sha1 = "0.10"
image = "0.25"
encoding_rs = "0.8"
